<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#005A36" />
  <title>Hamkkyu — SKKU Campus Buddy</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Nunito & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />

  <!-- React & ReactDOM (Production UMD) + Babel Standalone for in-browser JSX -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #e2e8f0;
      overscroll-behavior-y: none;
    }
    #root {
      height: 100%;
      width: 100%;
    }
    .app-shell {
      height: 100dvh;
      max-height: 100dvh;
    }
    @media (min-width: 640px) {
      .app-shell {
        height: 860px;
        max-height: 92dvh;
      }
    }
    .safe-top {
      padding-top: max(12px, env(safe-area-inset-top, 12px));
    }
    .safe-bottom {
      padding-bottom: max(8px, env(safe-area-inset-bottom, 8px));
    }

    /* Hamkkyu SVG & CSS Motion Engine */
    .hb {
      position: relative;
      width: var(--hb-size, 140px);
      height: var(--hb-size, 140px);
      display: inline-block;
      flex-shrink: 0;
      vertical-align: middle;
      user-select: none;
    }
    .hb svg { width: 100%; height: 100%; overflow: visible; display: block; }
    .hb .hb-squash { transform-origin: 100px 186px; animation: hb-breathe 3.2s ease-in-out infinite; }
    .hb .hb-body { transform-origin: 100px 186px; }
    .hb .hb-shadow { transform-origin: 100px 190px; }
    .hb .hb-eyes { transform-box: fill-box; transform-origin: center; transition: transform .25s ease; }
    .hb .hb-eye-open { transform-box: fill-box; transform-origin: center; animation: hb-blink 4.6s infinite; }
    .hb .hb-eye-happy, .hb .hb-eye-sleep, .hb .hb-m-open, .hb .hb-m-o, .hb .hb-m-flat { display: none; }
    .hb .hb-ears { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .2s ease; }
    .hb .hb-sprout { transform-box: fill-box; transform-origin: 50% 100%; }
    .hb .hb-paw { transition: transform .3s cubic-bezier(.3,1.4,.5,1); }
    .hb .hb-paw-l { transform: translate(86px,158px); }
    .hb .hb-paw-r { transform: translate(114px,158px); }
    .hb .hb-paw-r-in { transform-box: fill-box; transform-origin: 50% 260%; }
    .hb .hb-fx-wave, .hb .hb-fx-q, .hb .hb-z1, .hb .hb-z2, .hb .hb-s1, .hb .hb-s2, .hb .hb-s3 { opacity: 0; }
    .hb .hb-s1, .hb .hb-s2, .hb .hb-s3 { transform-box: fill-box; transform-origin: center; }

    /* Faces */
    .hb[data-face="wave"] .hb-paw-r { transform: translate(170px,90px); }
    .hb[data-face="wow"] .hb-paw-l { transform: translate(48px,150px); }
    .hb[data-face="wow"] .hb-paw-r { transform: translate(152px,150px); }
    .hb[data-face="wow"] .hb-eyes { transform: scale(1.15); }
    .hb[data-face="wow"] .hb-ears { transform: translateY(-4px); }
    .hb[data-face="wow"] .hb-m-smile { display: none; }
    .hb[data-face="wow"] .hb-m-o { display: inline; }
    .hb[data-face="think"] .hb-paw-r { transform: translate(113px,142px); }
    .hb[data-face="think"] .hb-eyes { transform: translate(2px,-3px); }
    .hb[data-face="think"] .hb-m-smile { display: none; }
    .hb[data-face="think"] .hb-m-flat { display: inline; }
    .hb[data-face="think"] .hb-fx-q { opacity: 1; animation: hb-bob 1.1s ease-in-out infinite alternate; }
    .hb[data-face="cheer"] .hb-paw-l { transform: translate(32px,86px); }
    .hb[data-face="cheer"] .hb-paw-r { transform: translate(168px,86px); }
    .hb[data-face="cheer"] .hb-eye-open { display: none; }
    .hb[data-face="cheer"] .hb-eye-happy { display: inline; }
    .hb[data-face="cheer"] .hb-m-smile { display: none; }
    .hb[data-face="cheer"] .hb-m-open { display: inline; }
    .hb[data-face="sleepy"] .hb-paw-l { transform: translate(92px,160px); }
    .hb[data-face="sleepy"] .hb-paw-r { transform: translate(108px,160px); }
    .hb[data-face="sleepy"] .hb-eye-open { display: none; }
    .hb[data-face="sleepy"] .hb-eye-sleep { display: inline; }
    .hb[data-face="sleepy"] .hb-m-smile { display: none; }
    .hb[data-face="sleepy"] .hb-m-flat { display: inline; }
    .hb[data-face="sleepy"] .hb-squash { animation-duration: 4.6s; }
    .hb[data-face="sleepy"] .hb-z1 { animation: hb-zz 2.6s ease-out infinite; }
    .hb[data-face="sleepy"] .hb-z2 { animation: hb-zz 2.6s ease-out 1.3s infinite; }

    /* Loops */
    .hb[data-loop="think"]:not([data-anim]) .hb-body { animation: hb-sway 2.4s ease-in-out infinite; }

    /* One-shots */
    .hb[data-anim="wave"] .hb-paw-r-in { animation: hb-wave .3s ease-in-out 4 alternate; }
    .hb[data-anim="wave"] .hb-fx-wave { animation: hb-flash 1.3s ease-out; }
    .hb[data-anim="hop"] .hb-body { animation: hb-hop .7s ease-out; }
    .hb[data-anim="hop"] .hb-shadow { animation: hb-shadow .7s ease-out; }
    .hb[data-anim="wow"] .hb-body { animation: hb-pop .55s ease-out; }
    .hb[data-anim="cheer"] .hb-body { animation: hb-hop .6s ease-out 2; }
    .hb[data-anim="cheer"] .hb-shadow { animation: hb-shadow .6s ease-out 2; }
    .hb[data-anim="grow"] .hb-sprout { animation: hb-grow .9s cubic-bezier(.3,1.6,.5,1) both; }
    .hb[data-anim="grow"] .hb-body { animation: hb-pop .55s ease-out .55s; }
    .hb[data-anim="hatch"] .hb-body { animation: hb-emerge .65s cubic-bezier(.3,1.5,.5,1) 1.15s both; }
    .hb[data-anim="wow"] .hb-s1, .hb[data-anim="cheer"] .hb-s1, .hb[data-anim="grow"] .hb-s1, .hb[data-anim="hatch"] .hb-s1 { animation: hb-twinkle .9s ease-out both; }
    .hb[data-anim="wow"] .hb-s2, .hb[data-anim="cheer"] .hb-s2, .hb[data-anim="grow"] .hb-s2 { animation: hb-twinkle .9s ease-out .15s both; }
    .hb[data-anim="wow"] .hb-s3, .hb[data-anim="cheer"] .hb-s3, .hb[data-anim="grow"] .hb-s3 { animation: hb-twinkle .9s ease-out .3s both; }
    .hb[data-anim="hatch"] .hb-s1 { animation-delay: 1.3s; }
    .hb[data-anim="hatch"] .hb-s2 { animation-delay: .9s ease-out 1.45s both; }
    .hb[data-anim="hatch"] .hb-s3 { animation-delay: .9s ease-out 1.6s both; }

    /* Ginkgo Leaf Pile (One-time Launch Reveal) */
    .hb .hb-pile { position: absolute; inset: 0; pointer-events: none; }
    .hb .hb-pile svg { width: 100%; height: 100%; overflow: visible; display: block; }
    .hb .hb-pile-all { transform-origin: 100px 192px; animation: hb-rustle .2s ease-in-out 5 alternate; }
    .hb .hb-leaf { animation: hb-leaf-fly .85s cubic-bezier(.25,.7,.4,1) var(--fd) forwards; }

    /* Confetti */
    .hb .hb-confetti {
      position: absolute; left: 50%; top: 38%; width: 7px; height: 11px; border-radius: 2px;
      pointer-events: none; animation: hb-confetti 1.2s cubic-bezier(.2,.7,.4,1) forwards;
    }

    /* Speech bubble */
    .hb .hb-bubble {
      position: absolute; z-index: 20; width: max-content; max-width: 225px;
      background: #FFFFFF; color: #1F1B3A; border: 1.5px solid #005A36; border-radius: 14px;
      padding: 7px 12px; font-weight: 800; font-size: 11px; line-height: 1.35;
      box-shadow: 0 6px 20px rgba(0,90,54,0.18); animation: hb-bubble .32s cubic-bezier(.3,1.5,.5,1);
    }
    .hb .hb-bubble[data-side="top"] { left: 50%; bottom: calc(100% + 4px); transform: translateX(-50%); }

    @keyframes hb-breathe { 0%, 100% { transform: scale(1,1); } 50% { transform: scale(1.015,1.03); } }
    @keyframes hb-blink { 0%, 93%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(.1); } }
    @keyframes hb-sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @keyframes hb-bob { from { transform: translateY(0); } to { transform: translateY(-6px); } }
    @keyframes hb-zz { 0% { opacity: 0; transform: translate(0,6px); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(10px,-18px); } }
    @keyframes hb-wave { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
    @keyframes hb-flash { 0%, 100% { opacity: 0; } 20%, 80% { opacity: 1; } }
    @keyframes hb-hop { 0% { transform: none; } 18% { transform: scale(1.08,.92); } 48% { transform: translateY(-24px) scale(.95,1.06); } 78% { transform: scale(1.06,.94); } 100% { transform: none; } }
    @keyframes hb-shadow { 0%, 100% { transform: none; opacity: 1; } 48% { transform: scale(.7); opacity:.5; } }
    @keyframes hb-pop { 0% { transform: none; } 30% { transform: scale(1.1,.94); } 60% { transform: scale(.97,1.05); } 100% { transform: none; } }
    @keyframes hb-twinkle { 0% { opacity: 0; transform: scale(0); } 40% { opacity: 1; transform: scale(1.3); } 100% { opacity: 0; transform: scale(.6); } }
    @keyframes hb-grow { 0% { transform: scale(0); } 100% { transform: scale(1); } }
    @keyframes hb-emerge { 0% { opacity: 0; transform: translateY(30px) scale(.4); } 100% { opacity: 1; transform: none; } }
    @keyframes hb-rustle { 0% { transform: rotate(-3deg) scale(1,1); } 100% { transform: rotate(3deg) scale(1.03,.97); } }
    @keyframes hb-leaf-fly {
      0% { transform: none; opacity: 1; }
      45% { transform: translate(calc(var(--fx) * .6), calc(var(--fy) * .8)) rotate(calc(var(--fr) * .5)); opacity: 1; }
      100% { transform: translate(var(--fx), calc(var(--fy) + 30px)) rotate(var(--fr)); opacity: 0; }
    }
    @keyframes hb-confetti { 0% { transform: translate(0,0) rotate(0); opacity: 1; } 100% { transform: translate(var(--dx),var(--dy)) rotate(var(--rot)); opacity: 0; } }
    @keyframes hb-bubble { from { opacity: 0; transform: translateX(-50%) scale(.6); } to { opacity: 1; transform: translateX(-50%) scale(1); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* Crisp Inline SVG Icons for Zero External Icon Font Dependencies */
    const Icon = ({ name, size = 18, className = '', fill = 'none' }) => {
      const props = {
        width: size,
        height: size,
        viewBox: '0 0 24 24',
        fill,
        stroke: 'currentColor',
        strokeWidth: 2,
        strokeLinecap: 'round',
        strokeLinejoin: 'round',
        className
      };

      switch (name) {
        case 'home':
          return <svg {...props}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
        case 'chat':
          return <svg {...props}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>;
        case 'map':
          return <svg {...props}><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>;
        case 'newspaper':
          return <svg {...props}><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></svg>;
        case 'menu':
          return <svg {...props}><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="18" x2="20" y2="18"/></svg>;
        case 'x':
          return <svg {...props}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
        case 'globe':
          return <svg {...props}><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>;
        case 'userPlus':
          return <svg {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>;
        case 'users':
          return <svg {...props}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
        case 'calendar':
          return <svg {...props}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
        case 'star':
          return <svg {...props}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>;
        case 'phone':
          return <svg {...props}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>;
        case 'utensils':
          return <svg {...props}><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>;
        case 'coffee':
          return <svg {...props}><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>;
        case 'search':
          return <svg {...props}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
        case 'send':
          return <svg {...props}><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>;
        case 'camera':
          return <svg {...props}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>;
        case 'lock':
          return <svg {...props}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
        case 'unlock':
          return <svg {...props}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>;
        case 'plus':
          return <svg {...props}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        case 'eye':
          return <svg {...props}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>;
        case 'help':
          return <svg {...props}><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>;
        case 'chevronRight':
          return <svg {...props}><polyline points="9 18 15 12 9 6"/></svg>;
        case 'zap':
          return <svg {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>;
        case 'shirt':
          return <svg {...props}><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>;
        case 'smile':
          return <svg {...props}><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>;
        case 'check':
          return <svg {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
        case 'sparkles':
          return <svg {...props}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>;
        case 'navigation':
          return <svg {...props}><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>;
        case 'pin':
          return <svg {...props}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>;
        default:
          return null;
      }
    };

    function HamkkyuMascot({ 
      outfit = 'uniform', 
      motion = 'idle', 
      motionTrigger = 0,
      size = 136, 
      speechBubble = null,
      className = '',
      onClick
    }) {
      const [activeAnim, setActiveAnim] = useState(null);
      const [confettiPieces, setConfettiPieces] = useState([]);
      const [showPile, setShowPile] = useState(false);

      const ONE_SHOTS = {
        wave: { face: 'wave', ms: 1300 },
        hop: { face: null, ms: 750 },
        wow: { face: 'wow', ms: 1100 },
        cheer: { face: 'cheer', ms: 1400, confetti: true },
        grow: { face: 'cheer', ms: 1300 },
        hatch: { face: 'wow', ms: 2200, pile: true }
      };

      const GINKGO_LEAF_PATH = 'M0 0 C-10 -8 -26 -26 -24 -42 Q-12 -50 -2 -44 L0 -37 L2 -44 Q12 -50 24 -42 C26 -26 10 -8 0 0 Z';
      const GINKGO_LEAVES = [
        [100, 192, 0, 1.9, '#E9B12A', 0, -150, 200],
        [64, 194, -38, 1.75, '#D9A21F', -120, -60, -260],
        [136, 194, 38, 1.75, '#F2C33A', 120, -70, 240],
        [44, 188, -72, 1.5, '#C9D04E', -150, 10, -300],
        [156, 188, 72, 1.5, '#EEBC2E', 150, 0, 280],
        [82, 158, -22, 1.6, '#F5CF4C', -90, -130, -200],
        [118, 158, 22, 1.6, '#E6AE25', 90, -140, 220],
        [100, 132, 0, 1.45, '#F7D85E', 10, -170, 160],
        [70, 120, -40, 1.1, '#B9C447', -110, -150, -180],
        [132, 118, 42, 1.1, '#F2C33A', 120, -150, 190]
      ];

      const LOOPS = {
        idle: 'happy',
        think: 'think',
        sleep: 'sleepy'
      };

      useEffect(() => {
        if (ONE_SHOTS[motion]) {
          const shot = ONE_SHOTS[motion];
          setActiveAnim(null);
          setShowPile(false);
          setConfettiPieces([]);

          const startTimer = setTimeout(() => {
            setActiveAnim(motion);
            if (shot.pile) setShowPile(true);
            if (shot.confetti) {
              const colors = ['#7B61FF', '#F28AB2', '#FFB547', '#2BB673', '#3E9BEA'];
              const pieces = Array.from({ length: 16 }).map((_, i) => {
                const angle = (Math.PI * 2 * i) / 16 + Math.random() * 0.4;
                const dist = 0.45 + Math.random() * 0.35;
                return {
                  id: `${Date.now()}-${i}`,
                  bg: colors[i % colors.length],
                  dx: Math.round(Math.cos(angle) * dist * size) + 'px',
                  dy: Math.round(Math.sin(angle) * dist * size - 20) + 'px',
                  rot: Math.round(Math.random() * 540 - 270) + 'deg'
                };
              });
              setConfettiPieces(pieces);
            }
          }, 20);

          const endTimer = setTimeout(() => {
            setActiveAnim(null);
            setShowPile(false);
            setConfettiPieces([]);
          }, shot.ms + 30);

          return () => {

                      <div className="space-y-2.5">
